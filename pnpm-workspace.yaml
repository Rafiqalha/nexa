packages:
  - apps/*
  - packages/*
  - lab/*

# pnpm >= 10 tidak menjalankan build script dependensi tanpa izin eksplisit.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  electron: true
  # Dependensi target Squirrel electron-builder; installer NEXA memakai NSIS, tidak perlu build.
  electron-winstaller: false
