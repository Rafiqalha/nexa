# Lab NEXA: sensor (reverse proxy + deception) di depan target-app fiktif.
# Jaringan `lab` bersifat internal (tanpa akses keluar). Hanya sensor yang punya
# kaki di jaringan `edge` untuk port yang dipublikasikan ke 127.0.0.1 host.
name: nexa-lab

services:
  target-app:
    build:
      context: ..
      dockerfile: lab/target-app/Dockerfile
    init: true
    environment:
      PORT: "3000"
    networks: [lab]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

  sensor:
    build:
      context: ..
      dockerfile: apps/sensor/Dockerfile
    init: true
    depends_on:
      target-app:
        condition: service_healthy
    # Secret (DASHBOARD_TOKEN, DEEPSEEK_API_KEY) hanya masuk ke container sensor.
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      SENSOR_HOST: 0.0.0.0
      SENSOR_PORT: "8080"
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: "8081"
      UPSTREAM_URL: http://target-app:3000
      DATABASE_PATH: /data/nexa.db
      SURICATA_RULES_DIR: /rules
    volumes:
      - nexa-data:/data
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    networks: [lab, edge]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

  # Agen penyerang uji: hanya dijalankan lewat `pnpm lab:attack` (profile attack).
  attacker-agent:
    profiles: [attack]
    build:
      context: ..
      dockerfile: lab/attacker-agent/Dockerfile
    depends_on:
      sensor:
        condition: service_healthy
    # SENGAJA tanpa env_file: secret sensor (DEEPSEEK_API_KEY, DASHBOARD_TOKEN) tidak masuk ke sini.
    environment:
      LAB_TARGET_ALLOWLIST: sensor:8080,target-app:3000
      ATTACKER_TARGET_URL: http://sensor:8080/
      ATTACKER_BASELINE_URL: http://target-app:3000/
      ATTACKER_LLM_BASE_URL: ${ATTACKER_LLM_BASE_URL:-https://api.deepseek.com}
      ATTACKER_LLM_MODEL: ${ATTACKER_LLM_MODEL:-deepseek-flash}
      ATTACKER_LLM_API_KEY: ${ATTACKER_LLM_API_KEY:-}
      ATTACKER_MAX_STEPS: ${ATTACKER_MAX_STEPS:-15}
      ATTACKER_MAX_TOKENS: ${ATTACKER_MAX_TOKENS:-250000}
      ATTACKER_STEP_DELAY_MS: ${ATTACKER_STEP_DELAY_MS:-1500}
      ATTACKER_REPORT_DIR: /app/lab/output
    volumes:
      - ../lab/output:/app/lab/output
    # `lab` (internal) untuk target; `egress` hanya agar agen bisa memanggil API model.
    networks: [lab, egress]

networks:
  lab:
    internal: true
  edge: {}
  egress: {}

volumes:
  nexa-data: {}
