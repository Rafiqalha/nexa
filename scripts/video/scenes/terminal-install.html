<!doctype html>
<html lang="id">
<meta charset="utf-8" />
<link rel="stylesheet" href="base.css" />
<script src="kit.js"></script>
<style>
  /* Bab "Memasang NEXA": prasyarat di kiri, terminal di kanan. Perintah diketik mengikuti narasi;
     keluaran adalah teks asli dari scripts/ensure-env.mjs dan scripts/lab.mjs (bukan karangan). */
  .h {
    position: absolute;
    left: 120px;
    top: 112px;
    font-size: 54px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .list {
    position: absolute;
    left: 120px;
    top: 230px;
    width: 460px;
  }
  .grp {
    font: 500 16px 'JetBrains Mono', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .it {
    display: flex;
    align-items: center;
    gap: 14px;
    height: 54px;
    border-bottom: 1px solid var(--line);
    font-size: 26px;
    color: var(--text);
  }
  .it .v {
    margin-left: auto;
    font: 400 20px 'JetBrains Mono', monospace;
    color: var(--muted);
  }
  .it svg {
    width: 22px;
    height: 22px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 2.2;
  }
  .opt .it {
    color: var(--text-2);
  }
  .opt .it svg {
    stroke: var(--muted);
  }
  .term {
    position: absolute;
    left: 660px;
    top: 112px;
    width: 1140px;
    height: 760px;
    background: #0f130f;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
  }
  .bar {
    height: 52px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    padding: 0 22px;
    gap: 10px;
    font: 400 18px 'JetBrains Mono', monospace;
    color: var(--muted);
  }
  .bar i {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--line-strong);
  }
  .body {
    padding: 26px 30px;
    font: 400 23px/1.75 'JetBrains Mono', monospace;
    white-space: pre;
  }
  .p {
    color: var(--accent);
  }
  .c {
    color: var(--text);
  }
  .o {
    color: var(--muted);
  }
  .ok {
    color: var(--accent);
  }
  .card {
    position: absolute;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    border-radius: 2px;
    padding: 20px 24px;
  }
  .card .k {
    font: 500 15px 'JetBrains Mono', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .card .t {
    font-size: 26px;
    font-weight: 600;
    margin-top: 8px;
  }
  .card .s {
    font: 400 18px 'JetBrains Mono', monospace;
    color: var(--text-2);
    margin-top: 6px;
  }
  .caret {
    display: inline-block;
    width: 12px;
    height: 26px;
    background: var(--text-2);
    vertical-align: -5px;
  }
</style>
<body>
  <div class="h" id="h">Memasang NEXA</div>
  <div class="list" id="req">
    <div class="grp">Wajib</div>
    <div class="it" id="r1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>Git<span class="v">apa saja</span></div>
    <div class="it" id="r2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>Node.js<span class="v">≥ 20</span></div>
    <div class="it" id="r3"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>pnpm<span class="v">12.18.0</span></div>
    <div class="opt" id="opt" style="margin-top: 40px">
      <div class="grp">Opsional</div>
      <div class="it"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>Docker Compose</div>
      <div class="it"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>Suricata (Docker / WSL)</div>
      <div class="it"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>API key DeepSeek</div>
    </div>
  </div>
  <div class="term" id="term">
    <div class="bar"><i></i><i></i><i></i><span style="margin-left: 12px">~/nexa</span></div>
    <div class="body" id="body"></div>
  </div>
  <div class="card" id="dash" style="left: 660px; top: 900px; width: 560px">
    <div class="k">Dashboard</div>
    <div class="t">http://127.0.0.1:8081</div>
    <div class="s">akun pertama = pemilik (Admin)</div>
  </div>
  <div class="card" id="desk" style="left: 1240px; top: 900px; width: 560px">
    <div class="k">Windows · rilis GitHub</div>
    <div class="t">NEXA Dashboard v0.3.1</div>
    <div class="s">NEXA-Dashboard-Setup-0.3.1.exe</div>
  </div>
  <script>
    const { $, cue, clamp, ease } = kit;
    const esc = (s) => s.replaceAll('&', '&amp;').replaceAll('<', '&lt;');
    window.__frame = (t) => {
      const T = {
        req: cue('Yang dibutuhkan', 2.5),
        opt: cue('Docker dan Suricata', 7.5),
        clone: cue('Clone', 10.5),
        inst: cue('pnpm install', 13),
        env: cue('pnpm env init', 15),
        lab: cue('Nyalakan lab', 22),
        auto: cue('NEXA memilih', 25),
        dash: cue('Dashboard terbuka', 29),
        win: cue('Untuk Windows', 35),
      };
      const rev = (el, at, dy = 14) => {
        const k = ease(clamp((t - at) / 0.5, 0, 1));
        el.style.opacity = k;
        el.style.transform = `translateY(${(1 - k) * dy}px)`;
      };
      rev($('#h'), 0.1);
      rev($('#term'), 0.4);
      for (const [i, id] of ['#r1', '#r2', '#r3'].entries()) rev($(id), T.req + 0.5 + i * 0.45);
      rev($('#opt'), T.opt);
      rev($('#dash'), T.dash);
      rev($('#desk'), T.win);
      // Perintah diketik ±30 karakter/detik; keluaran muncul setelah perintah "selesai".
      const cmds = [
        { at: T.clone - 0.4, cmd: 'git clone https://github.com/Rafiqalha/nexa.git && cd nexa' },
        { at: T.inst - 0.3, cmd: 'pnpm install' },
        { at: T.env - 0.3, cmd: 'pnpm env:init', out: [['[env] .env dibuat dari .env.example (token acak dibuat).', 1.0]] },
        {
          at: T.lab - 0.3,
          cmd: 'pnpm lab:up',
          out: [
            ['[lab] Docker tidak tersedia -> mode local (proses Node di host)', T.auto - T.lab + 0.2],
            ['[lab] target-app :3000  sensor publik http://127.0.0.1:8080  admin http://127.0.0.1:8081', T.dash - T.lab - 0.2],
          ],
        },
      ];
      const lines = [];
      let typing = false;
      for (const c of cmds) {
        if (t < c.at) break;
        const n = Math.min(c.cmd.length, Math.floor((t - c.at) * 30));
        typing = n < c.cmd.length;
        lines.push(`<span class="p">$</span> <span class="c">${esc(c.cmd.slice(0, n))}</span>${typing ? '<span class="caret"></span>' : ''}`);
        if (!typing && !c.out) lines.push('<span class="ok">✓</span><span class="o"> selesai</span>');
        for (const [txt, d] of c.out ?? []) {
          if (t >= c.at + c.cmd.length / 30 + d) lines.push(`<span class="o">${esc(txt)}</span>`);
        }
      }
      if (!typing) lines.push(`<span class="p">$</span> <span class="caret" style="opacity:${Math.floor(t * 2) % 2 ? 0 : 1}"></span>`);
      $('#body').innerHTML = lines.join('\n');
    };
  </script>
</body>
</html>
